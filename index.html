<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Cafe Color Map</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }
    body {
      display: grid;
      place-items: center;
    }
    .map-stage {
      position: relative;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      overflow: hidden;
      isolation: isolate;
      background: #050505;
      cursor: crosshair;
      touch-action: none;
    }
    .map-stage.is-zoomed {
      cursor: grab;
    }
    .map-stage.is-panning {
      cursor: grabbing;
    }
    .map-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #050505;
      image-rendering: pixelated;
      cursor: inherit;
      touch-action: none;
      outline: none;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, transparent calc(100% - 1px), rgba(4, 5, 8, 0.38) 100%),
        linear-gradient(to bottom, transparent calc(100% - 1px), rgba(4, 5, 8, 0.38) 100%);
      background-size: var(--tile-step, 100%) var(--tile-step, 100%);
    }
    .hover-outline {
      position: absolute;
      z-index: 2;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.94);
      border-radius: 1px;
      box-shadow:
        inset 0 0 0 1px rgba(8, 9, 12, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.15),
        0 0 16px rgba(255, 255, 255, 0.24);
      pointer-events: none;
    }
    .hover-card {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(280px, calc(100vw - 24px));
      padding: 9px 12px;
      color: #f3f2ef;
      background: rgba(12, 13, 16, 0.92);
      border: 1px solid rgba(240, 240, 245, 0.18);
      border-radius: 9px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: 500 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
    }
    .hover-card[hidden], .hover-outline[hidden] {
      display: none;
    }
    .hover-swatch {
      flex: 0 0 15px;
      width: 15px;
      height: 15px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }
    .hover-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }
    .hover-hex {
      color: #fff;
      font: 650 13px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.035em;
    }
    .hover-meta {
      overflow: hidden;
      color: rgba(235, 235, 240, 0.76);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hover-time {
      color: rgba(210, 212, 220, 0.52);
      font-size: 10px;
      letter-spacing: 0.01em;
    }
    .hover-time[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="map-stage" id="map-stage">
    <div class="map-layer" id="map-layer">
      <canvas id="map" tabindex="0" aria-label="Cafe color drop map"></canvas>
      <div class="grid-lines" id="grid-lines" aria-hidden="true"></div>
      <div class="hover-outline" id="hover-outline" hidden aria-hidden="true"></div>
    </div>
    <div class="hover-card" id="hover-card" role="status" aria-live="polite" hidden>
      <span class="hover-swatch" id="hover-swatch" aria-hidden="true"></span>
      <span class="hover-copy">
        <strong class="hover-hex" id="hover-hex"></strong>
        <span class="hover-meta" id="hover-meta"></span>
        <span class="hover-time" id="hover-time" hidden></span>
      </span>
    </div>
  </div>
  <script>
    // Public JSON endpoint. No API key is needed to read the archive.
    const DROPS_JSON_URL = "https://stalica.net/colorapi89167236746237642364872aBACcc/index.php?action=drops";
    const MAX_CANVAS_SIDE = 4096;
    const MAX_CELL_SIZE = 256;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 16;
    const stage = document.getElementById("map-stage");
    const mapLayer = document.getElementById("map-layer");
    const canvas = document.getElementById("map");
    const context = canvas.getContext("2d", { alpha: false });
    const hoverOutline = document.getElementById("hover-outline");
    const hoverCard = document.getElementById("hover-card");
    const hoverSwatch = document.getElementById("hover-swatch");
    const hoverHex = document.getElementById("hover-hex");
    const hoverMeta = document.getElementById("hover-meta");
    const hoverTime = document.getElementById("hover-time");
    let drops = [];
    let side = 0;
    let hoveredIndex = -1;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let didDrag = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartPanX = 0;
    let dragStartPanY = 0;
    let suppressClick = false;

    function validHex(value) {
      const hex = String(value || "").replace(/^#/, "").trim().toUpperCase();
      return /^[0-9A-F]{6}$/.test(hex) ? hex : "050505";
    }

    function draw() {
      side = drops.length ? Math.ceil(Math.sqrt(drops.length)) : 1;
      stage.style.setProperty("--tile-step", `${100 / side}%`);
      if (!drops.length) {
        canvas.width = 1;
        canvas.height = 1;
        context.fillStyle = "#050505";
        context.fillRect(0, 0, 1, 1);
        return;
      }
      const size = Math.max(1, Math.min(MAX_CANVAS_SIDE, side * MAX_CELL_SIZE));
      const cell = size / side;
      canvas.width = size;
      canvas.height = size;
      context.imageSmoothingEnabled = false;
      context.fillStyle = "#050505";
      context.fillRect(0, 0, size, size);

      for (let index = 0; index < drops.length; index++) {
        const x = (index % side) * cell;
        const y = Math.floor(index / side) * cell;
        context.fillStyle = `#${validHex(drops[index].hex)}`;
        context.fillRect(x, y, cell, cell);
      }
    }

    function clampPan() {
      const minX = stage.clientWidth * (1 - zoom);
      const minY = stage.clientHeight * (1 - zoom);
      panX = Math.max(minX, Math.min(0, panX));
      panY = Math.max(minY, Math.min(0, panY));
    }

    function applyView() {
      clampPan();
      mapLayer.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoom})`;
      stage.classList.toggle("is-zoomed", zoom > MIN_ZOOM);
    }

    function zoomAt(screenX, screenY, factor) {
      const mapX = (screenX - panX) / zoom;
      const mapY = (screenY - panY) / zoom;
      zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
      panX = screenX - mapX * zoom;
      panY = screenY - mapY * zoom;
      applyView();
    }

    function hideHover() {
      hoveredIndex = -1;
      hoverOutline.hidden = true;
      hoverCard.hidden = true;
    }

    function placeHoverCard(x, y) {
      const gap = 12;
      const cardWidth = hoverCard.offsetWidth;
      const cardHeight = hoverCard.offsetHeight;
      let left = x + gap;
      let top = y + gap;
      if (left + cardWidth > stage.clientWidth - 8) left = x - cardWidth - gap;
      if (top + cardHeight > stage.clientHeight - 8) top = y - cardHeight - gap;
      left = Math.max(8, Math.min(left, stage.clientWidth - cardWidth - 8));
      top = Math.max(8, Math.min(top, stage.clientHeight - cardHeight - 8));
      hoverCard.style.left = `${left}px`;
      hoverCard.style.top = `${top}px`;
    }

    function showDrop(index, screenX, screenY) {
      if (index !== hoveredIndex) {
        hoveredIndex = index;
        const drop = drops[index];
        const hex = validHex(drop.hex);
        const column = index % side;
        const row = Math.floor(index / side);
        const step = 100 / side;
        hoverOutline.style.left = `${column * step}%`;
        hoverOutline.style.top = `${row * step}%`;
        hoverOutline.style.width = `${step}%`;
        hoverOutline.style.height = `${step}%`;
        hoverSwatch.style.backgroundColor = `#${hex}`;
        hoverHex.textContent = `#${hex}`;
        hoverMeta.textContent = `${String(drop.username || "Unknown")} · ${String(drop.tier || "Unknown tier")}`;
        const rolledAt = String(drop.rolled_at || "");
        const time = new Date(rolledAt);
        hoverTime.textContent = rolledAt
          ? (Number.isNaN(time.getTime()) ? rolledAt : time.toLocaleString())
          : "";
        hoverTime.hidden = !rolledAt;
        hoverOutline.hidden = false;
        hoverCard.hidden = false;
      }
      placeHoverCard(screenX, screenY);
    }

    function dropAtPointer(event) {
      if (!drops.length || !side) {
        hideHover();
        return;
      }
      const bounds = stage.getBoundingClientRect();
      const screenX = event.clientX - bounds.left;
      const screenY = event.clientY - bounds.top;
      const mapX = (screenX - panX) / zoom;
      const mapY = (screenY - panY) / zoom;
      if (
        screenX < 0 || screenY < 0 || screenX >= bounds.width || screenY >= bounds.height ||
        mapX < 0 || mapY < 0 || mapX >= stage.clientWidth || mapY >= stage.clientHeight
      ) {
        hideHover();
        return;
      }
      const column = Math.min(side - 1, Math.floor(mapX / stage.clientWidth * side));
      const row = Math.min(side - 1, Math.floor(mapY / stage.clientHeight * side));
      const index = row * side + column;
      if (index < 0 || index >= drops.length) {
        hideHover();
        return;
      }
      showDrop(index, screenX, screenY);
    }

    function endPan(event) {
      if (!isPanning) return;
      isPanning = false;
      stage.classList.remove("is-panning");
      if (didDrag) {
        suppressClick = true;
        window.setTimeout(() => { suppressClick = false; }, 0);
      }
      didDrag = false;
      dropAtPointer(event);
    }

    stage.addEventListener("wheel", (event) => {
      event.preventDefault();
      const bounds = stage.getBoundingClientRect();
      const screenX = event.clientX - bounds.left;
      const screenY = event.clientY - bounds.top;
      const delta = event.deltaMode === 1
        ? event.deltaY * 16
        : event.deltaMode === 2
          ? event.deltaY * stage.clientHeight
          : event.deltaY;
      zoomAt(screenX, screenY, Math.exp(-delta * 0.0016));
      dropAtPointer(event);
    }, { passive: false });

    stage.addEventListener("pointerdown", (event) => {
      if (zoom <= MIN_ZOOM || event.button !== 0) return;
      isPanning = true;
      didDrag = false;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragStartPanX = panX;
      dragStartPanY = panY;
      stage.classList.add("is-panning");
      hideHover();
      stage.setPointerCapture(event.pointerId);
    });

    stage.addEventListener("pointermove", (event) => {
      if (isPanning) {
        const dx = event.clientX - dragStartX;
        const dy = event.clientY - dragStartY;
        if (Math.abs(dx) + Math.abs(dy) > 3) didDrag = true;
        if (didDrag) {
          panX = dragStartPanX + dx;
          panY = dragStartPanY + dy;
          applyView();
          hideHover();
          return;
        }
      }
      dropAtPointer(event);
    });

    stage.addEventListener("pointerup", endPan);
    stage.addEventListener("pointercancel", endPan);
    stage.addEventListener("lostpointercapture", endPan);
    stage.addEventListener("pointerleave", () => {
      if (!isPanning) hideHover();
    });
    stage.addEventListener("click", (event) => {
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      dropAtPointer(event);
    });

    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Home" && drops.length) {
        showDrop(0, stage.clientWidth / 2, stage.clientHeight / 2);
      } else if (event.key === "End" && drops.length) {
        const index = drops.length - 1;
        showDrop(index, stage.clientWidth / 2, stage.clientHeight / 2);
      }
    });

    window.addEventListener("resize", applyView);

    async function load() {
      try {
        const url = `${DROPS_JSON_URL}${DROPS_JSON_URL.includes("?") ? "&" : "?"}_=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`Archive returned HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Archive response is not a JSON array");
        hideHover();
        drops = data.filter((drop) => drop && /^[0-9A-Fa-f]{6}$/.test(String(drop.hex || "").replace(/^#/, "")));
        draw();
      } catch (error) {
        console.error("Cafe color map could not load its public JSON archive:", error);
      }
    }

    applyView();
    load();
    window.setInterval(load, 60000);
  </script>
</body>
</html>
